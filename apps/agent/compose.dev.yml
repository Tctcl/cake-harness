# Local development harness for the workspace image. There is no backend yet, so
# the desired tooling and the credentials arrive as mounted documents instead of
# over HTTP. Build the bootstrap first: `pnpm build` in this directory.
#
#   docker compose -f compose.dev.yml up --build
#   ssh -i dev/ssh/id_ed25519 -p 2222 dev@127.0.0.1
name: dev-env

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: tctcl/dev-env:dev
    ports:
      # Loopback only: compose publishes on 0.0.0.0 by default, which would put a
      # single-key sshd on the network.
      - "127.0.0.1:2222:22"
    environment:
      DEV_ENV_CONFIG_DIR: /etc/dev-env
      SSH_AUTHORIZED_KEYS_FILE: /etc/dev-env/authorized_keys
    volumes:
      - ./dev/desired-tooling.json:/etc/dev-env/desired-tooling.json:ro
      - ./dev/credentials.json:/etc/dev-env/credentials.json:ro
      - ./dev/ssh/id_ed25519.pub:/etc/dev-env/authorized_keys:ro
      - workspace:/home/dev/workspace

volumes:
  workspace:
