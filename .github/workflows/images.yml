name: images

# Two channels, three images each.
#
#   release published  → `X.Y.Z`, `X.Y` and `latest` — what an install resolves.
#   push to main       → `staging`, overwritten on every merge — what a staging
#                        install tracks. Not a version: it is the head of main by
#                        definition, so an install that follows it follows main.
#
# `latest` is a moving pointer to the newest release, exactly like the GitHub
# release it belongs to. `install.sh` still resolves `--version latest` through
# the releases API and pins a concrete `X.Y.Z`, so an install does not drift; the
# moving tag is for a staging install that switches back to production, or for
# anything else that wants "current release" without asking the API.

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            suffix: ''
            context: .
            dockerfile: Dockerfile
            prebuild: 'false'
            upstream: ''
            upstreamRef: ''
          - name: workspace
            suffix: /workspace
            context: apps/agent
            dockerfile: apps/agent/Dockerfile
            prebuild: 'true'
            upstream: ''
            upstreamRef: ''
          # CipherGate, the secrets store. Upstream publishes neither a container nor an
          # npm package, and the install has to bring everything its stack runs, so this
          # repository builds it from a pinned commit and republishes it on both channels.
          # `upstreamRef` is the commit `v1.4.1` points at; move it deliberately, never
          # through a workflow that resolves `main`.
          - name: ciphergate
            suffix: /ciphergate
            context: .ciphergate
            dockerfile: .ciphergate/Dockerfile
            prebuild: 'false'
            upstream: maverick0628/ciphergate
            upstreamRef: c86c5ec6aa06a101da26b55e7be9f71f9e372900

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # A second checkout into a subdirectory, so the build context for the upstream image is
      # a copy of upstream at the pinned commit and not a vendored tree in this repository.
      - name: Check out the upstream source
        if: matrix.upstream != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.upstream }}
          ref: ${{ matrix.upstreamRef }}
          path: .ciphergate

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        if: matrix.prebuild == 'true'

      - name: Enable Node
        uses: actions/setup-node@v7
        if: matrix.prebuild == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: matrix.prebuild == 'true'
        run: pnpm install --frozen-lockfile

      # The workspace image copies `apps/agent/dist`, which is ignored by Git, so
      # the bootstrap is compiled before the build context is correct. The app
      # image compiles both apps inside its own multi-stage Dockerfile instead.
      - name: Build the bootstrap
        if: matrix.prebuild == 'true'
        run: pnpm --filter @tctcl/agent build

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=staging,enable=${{ github.event_name == 'push' }}
          # Name where the code came from. For the upstream image that is upstream's repository
          # and the pinned commit, not ours: an operator who pulls it should be able to find out.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.upstream || github.repository }}
            org.opencontainers.image.revision=${{ matrix.upstreamRef || github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
