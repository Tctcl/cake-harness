name: commits

# The pull request title becomes the commit on main (squash merge), so that is
# what release-please reads. Keep this list in sync with commitlint.config.mjs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional pull request title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: >-
            The title subject must start lowercase, describe the change in the
            imperative mood, and not end with a period.
          wip: true
